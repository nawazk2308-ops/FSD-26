<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>display</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- block -->
    <div class="block">
        <p>this is display block</p>
    </div>



    <!-- inline -->

    <div class="inline">
        <p>this is display inline</p>
    </div>
    <br>


    <!-- inline-block -->

    <div class="inline-block">
        <p>this is display inline block</p>
    </div>

    <div class="inline-block">
        <p>this is display inline block</p>
    </div>


    <div class="car">
        <img src="https://images.pexels.com/photos/112460/pexels-photo-112460.jpeg" alt="car" />
    </div>

    <div class="bike">
        <img src="https://images.pexels.com/photos/2549941/pexels-photo-2549941.jpeg" alt="bike" />
    </div>
</body>

</html>
